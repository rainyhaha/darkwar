    function getFormattedVersionText(dateStr, lang) {
        if (!dateStr || dateStr.length !== 8) return "";
        const year = dateStr.substring(0, 4);
        const monthNum = parseInt(dateStr.substring(4, 6), 10);
        const dayNum = parseInt(dateStr.substring(6, 8), 10);
        if (lang === 'ko') return `최종 업데이트: ${year}년 ${monthNum}월 ${dayNum}일`;
        else if (lang === 'en') {
            const monthsEn = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            return `Last Updated: ${monthsEn[monthNum - 1]} ${dayNum}, ${year}`;
        } else if (lang === 'vi') return `Cập nhật lần cuối: Ngày ${dayNum} tháng ${monthNum} năm ${year}`;
        return "";
    }

    // JSON 데이터를 화면에 그려주는 함수 (R2 먼저 그 다음 R1 출력 적용)
    function renderRoster(lang) {
        const rosterContainer = document.getElementById('roster-container');
        rosterContainer.innerHTML = '';

        const title = document.createElement('h2');
        title.innerHTML = rosterTranslations[lang].title;
        rosterContainer.appendChild(title);

        // 🔥 R2가 먼저 나오고 R1이 나오도록 순서 명시
        const displayOrder = ['R2', 'R1'];

        for (const tier of displayOrder) {
            const data = bgbParticipants[tier];
            if(!data) continue;

            const groupDiv = document.createElement('div');
            groupDiv.className = 'tier-group';

            const header = document.createElement('div');
            header.className = 'tier-header';
            header.textContent = `[${tier}]`;
            groupDiv.appendChild(header);

            const gridDiv = document.createElement('div');
            gridDiv.className = 'status-grid';

            const checkedCard = createStatusCard(rosterTranslations[lang].checked, data.checked, 'checked', lang);
            const uncheckedCard = createStatusCard(rosterTranslations[lang].unchecked, data.unchecked, 'unchecked', lang);
            
            gridDiv.appendChild(checkedCard);
            gridDiv.appendChild(uncheckedCard);

            groupDiv.appendChild(gridDiv);
            rosterContainer.appendChild(groupDiv);
        }
    }

    function createStatusCard(titleText, members, statusType, lang) {
        const card = document.createElement('div');
        card.className = 'status-card';

        const header = document.createElement('div');
        header.className = `status-header ${statusType}`;
        
        const titleSpan = document.createElement('span');
        titleSpan.textContent = titleText;
        
        const countSpan = document.createElement('span');
        const postfix = rosterTranslations[lang].count ? ` ${rosterTranslations[lang].count}` : '';
        countSpan.textContent = `${members.length}${postfix}`;

        header.appendChild(titleSpan);
        header.appendChild(countSpan);
        card.appendChild(header);

        const ul = document.createElement('ul');
        ul.className = 'member-list-roster';

        members.forEach((member, index) => {
            const li = document.createElement('li');
            li.className = 'member-item-roster';
            
            const nameDiv = document.createElement('div');
            nameDiv.className = 'member-name-roster';
            nameDiv.innerHTML = `<span class="rank">${index + 1}</span> ${member.name}`;
            
            const powerDiv = document.createElement('div');
            powerDiv.className = 'member-power-roster';
            powerDiv.innerHTML = `<span class="power-icon">🛡️</span> ${member.power}`;

            li.appendChild(nameDiv);
            li.appendChild(powerDiv);
            ul.appendChild(li);
        });

        card.appendChild(ul);
        return card;
    }

    function renderPage(lang) {
        document.getElementById('page-title').textContent = headerTranslations[lang].title;
        document.getElementById('version-text').textContent = getFormattedVersionText(updateDate, lang);
        document.getElementById('subtitle-text').textContent = headerTranslations[lang].subtitle;
        document.getElementById('support-text').textContent = headerTranslations[lang].support;
        document.getElementById('footer-text').textContent = footerTranslations[lang];
        
        const container = document.getElementById('accordion-container');
        container.innerHTML = '';
        
        allianceRulesData.forEach((group, groupIndex) => {
            const details = document.createElement('details');
            details.open = true;
            const summary = document.createElement('summary');
            summary.textContent = group.title[lang];
            summary.style.backgroundColor = rainbowColors[groupIndex % rainbowColors.length];
            details.appendChild(summary);
            const ul = document.createElement('ul');
            ul.className = 'menu-list';
            group.rules[lang].forEach((ruleObj, itemIndex) => {
                const li = document.createElement('li');
                const ruleItem = document.createElement('div');
                ruleItem.className = 'rule-item';
                const contentWrapper = document.createElement('div');
                contentWrapper.className = 'item-content';
                const badge = document.createElement('span');
                badge.className = 'item-badge';
                badge.textContent = itemIndex + 1;
                const titleSpan = document.createElement('span');
                titleSpan.className = 'item-title';
                titleSpan.textContent = ruleObj.text;
                contentWrapper.appendChild(badge);
                contentWrapper.appendChild(titleSpan);
                ruleItem.appendChild(contentWrapper);
                li.appendChild(ruleItem);
                ul.appendChild(li);
                if (ruleObj.subRules && ruleObj.subRules.length > 0) {
                    ruleObj.subRules.forEach((subText, subIndex) => {
                        const subLi = document.createElement('li');
                        const subRuleItem = document.createElement('div');
                        subRuleItem.className = 'rule-item sub-rule';
                        const subContentWrapper = document.createElement('div');
                        subContentWrapper.className = 'item-content';
                        const subBadge = document.createElement('span');
                        subBadge.className = 'sub-badge';
                        subBadge.textContent = `${itemIndex + 1}-${subIndex + 1}`;
                        const subTitleSpan = document.createElement('span');
                        subTitleSpan.className = 'item-title';
                        subTitleSpan.style.color = '#555';
                        subTitleSpan.textContent = subText;
                        subContentWrapper.appendChild(subBadge);
                        subContentWrapper.appendChild(subTitleSpan);
                        subRuleItem.appendChild(subContentWrapper);
                        subLi.appendChild(subRuleItem);
                        ul.appendChild(subLi);
                    });
                }
            });
            details.appendChild(ul);
            container.appendChild(details);
        });

        // ✨ 명단 리스트 렌더링 호출
        renderRoster(lang);
    }

    const langSelect = document.getElementById('langSelect');
    langSelect.addEventListener('change', function(e) {
        const selectedLang = e.target.value;
        localStorage.setItem('lang', selectedLang);
        renderPage(selectedLang);
    });

    const savedLang = localStorage.getItem('lang') || 'ko';
    langSelect.value = savedLang; 
    renderPage(savedLang); 
</script>
